name: "archiver"

services:
  broker:
    container_name: "valkey"
    image: "valkey/valkey"
    restart: unless-stopped
    command:
      - "--requirepass ${REDIS_PASS}"
      - "--appendonly yes"
      - "--appendfsync everysec"
    volumes:
      - "broker-data:/data"
  worker:
    container_name: "archiver-worker"
    stop_grace_period: 20s
    image: "ghcr.io/juansaenz04/archiver-worker:latest"
    environment:
      REDIS_URL: "redis://:${REDIS_PASS}@broker:6379/0"
      ARCHIVES_DIR: "/archives"
      CRAWLER_TIMEOUT: "30"
      ANUBIS_MODE: "auto"
      JOB_TIMEOUT: "${JOB_TIMEOUT:-3600}"
    volumes:
      - "./archives:/archives"
    restart: unless-stopped
  api:
    container_name: "archiver-api"
    image: "ghcr.io/juansaenz04/archiver-api:latest"
    environment:
      ARCHIVES_DIR: "/archives"
      REDIS_URL: "redis://:${REDIS_PASS}@broker:6379/0"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      REPLAY_PUBLIC_URL: "${REPLAY_PUBLIC_URL}"
    volumes:
      - "./archives:/archives"
    restart: unless-stopped
    ports:
      - "${APP_PORT}:1080"
      - "${REPLAY_PORT}:1081"

volumes:
  broker-data:

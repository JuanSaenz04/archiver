<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Archive Viewer</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
            }
            replay-web-page {
                height: 100%;
                width: 100%;
                display: block;
            }
        </style>
        <script src="/replay/ui.js"></script>
    </head>
    <body>
        <replay-web-page
            embed="default"
            replayBase="/replay/"
            sandbox
            requireSubdomainIframe
        ></replay-web-page>
        <script>
            const params = new URLSearchParams(window.location.search);
            const source = params.get("source");
            if (source) {
                const sourceUrl = new URL(source, window.location.origin);
                if (
                    sourceUrl.origin === window.location.origin &&
                    sourceUrl.pathname.startsWith("/archives/")
                ) {
                    document
                        .querySelector("replay-web-page")
                        .setAttribute("source", sourceUrl.href);
                }
            }
        </script>
    </body>
</html>
